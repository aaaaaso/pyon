<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1446">
<meta name="description" content="5さい向けの3Dゲーム。タップでジャンプして、ほしやおかしを集めながらエスカレーターで上の階をめざそう。">
<meta property="og:title" content="エスカレーター ぴょん">
<meta property="og:description" content="5さい向けの3Dゲーム。タップでジャンプして、ほしやおかしを集めながらエスカレーターで上の階をめざそう。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 6l13 29 31 3-23 21 7 31-28-16-28 16 7-31L6 38l31-3z' fill='%23ffd400' stroke='%23ff8a00' stroke-width='5'/%3E%3C/svg%3E">
<title>エスカレーター ぴょん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@800&display=swap">
<style>
/* 夜のショッピングモール × ネオン。画面いっぱいの3Dに、HUDは角に寄せて子どもの視線を真ん中に残す */
:root {
  color-scheme: dark;
  --night: #1b1446;
  --ink: #120c33;
  --pop: #ff4fa3;
  --sun: #ffd400;
  --sky: #23c4ff;
  --paper: #ffffff;
  --digit: #ff9a1f;
  --f-display: "Mochiy Pop One", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", sans-serif;
  --f-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; overflow: hidden; background: var(--night); color: var(--paper); font-family: var(--f-body); user-select: none; -webkit-user-select: none; touch-action: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; }
#floorPanel {
  position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px));
  background: var(--ink); border: 4px solid #3a2f7a; border-radius: 18px; padding: 10px 16px 12px;
  display: grid; grid-template-columns: auto auto auto; align-items: center; gap: 4px 12px;
  box-shadow: 0 6px 0 #0a0720;
}
#floorPanel .num { font-family: var(--f-display); font-size: clamp(28px, 5vw, 46px); color: var(--digit); text-shadow: 0 0 12px rgba(255,154,31,.8); line-height: 1; font-variant-numeric: tabular-nums; }
#floorPanel .num small { font-size: .45em; margin-left: 2px; }
#floorPanel .arrow { font-size: clamp(18px, 3vw, 28px); color: #7dffb2; text-shadow: 0 0 10px #7dffb2; animation: arrowUp 0.8s ease-in-out infinite; }
@keyframes arrowUp { 0%,100% { transform: translateY(3px); opacity: .6 } 50% { transform: translateY(-4px); opacity: 1 } }
#floorPanel .bar { grid-column: 1 / -1; height: 10px; border-radius: 6px; background: #2d2466; overflow: hidden; }
#barFill { display: block; height: 100%; width: 0%; border-radius: 6px; background: linear-gradient(90deg, #ff4fa3, #ffd400, #7dffb2, #23c4ff); }

#starPanel {
  position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 8px; background: var(--ink); border: 4px solid #3a2f7a; border-radius: 999px;
  padding: 6px 22px 6px 12px; box-shadow: 0 6px 0 #0a0720;
}
#starPanel .star { font-size: clamp(34px, 6vw, 54px); color: var(--sun); text-shadow: 0 0 16px rgba(255,212,0,.9); line-height: 1; display: inline-block; animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }
#starCount { font-family: var(--f-display); font-size: clamp(34px, 6vw, 56px); line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: right; }
#starPanel.bump { animation: bump .35s cubic-bezier(.3,1.8,.5,1); }
@keyframes bump { 0% { transform: scale(1) } 40% { transform: scale(1.25) rotate(-4deg) } 100% { transform: scale(1) } }

/* 吹き出し文字 */
#pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.pop {
  position: absolute; transform: translate(-50%, -50%); font-family: var(--f-display); white-space: nowrap;
  font-size: clamp(22px, 4vw, 34px); color: var(--sun); -webkit-text-stroke: 2px #4a1d00; paint-order: stroke fill;
  animation: popUp 1.1s cubic-bezier(.2,1.6,.4,1) forwards;
}
.pop.big {
  font-size: clamp(44px, 10vw, 110px); -webkit-text-stroke: 0;
  background: linear-gradient(90deg, #ff4fa3, #ffd400, #7dffb2, #23c4ff, #b36bff, #ff4fa3); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 5px 0 #120c33) drop-shadow(0 0 20px rgba(255,255,255,.55));
  animation: popBig 1.8s cubic-bezier(.2,1.6,.4,1) forwards, rainbow 1s linear infinite;
}
.pop.mid { font-size: clamp(30px, 6vw, 60px); color: #fff; -webkit-text-stroke: 3px #ff4fa3; }
.pop.ouch { color: #a8e9ff; -webkit-text-stroke: 2px #0b3550; }
@keyframes popUp { 0% { transform: translate(-50%,-50%) scale(.2); opacity: 0 } 20% { transform: translate(-50%,-50%) scale(1.25); opacity: 1 } 40% { transform: translate(-50%,-50%) scale(1) } 100% { transform: translate(-50%,-160%) scale(1); opacity: 0 } }
@keyframes popBig { 0% { transform: translate(-50%,-50%) scale(.1) rotate(-12deg); opacity: 0 } 18% { transform: translate(-50%,-50%) scale(1.2) rotate(4deg); opacity: 1 } 30% { transform: translate(-50%,-50%) scale(1) rotate(0) } 82% { opacity: 1 } 100% { transform: translate(-50%,-70%) scale(1.05); opacity: 0 } }
@keyframes rainbow { to { background-position: 200% 0 } }

/* ジャンプの合図：ぽんぽん広がる輪っか（文字の説明はなし） */
#hint {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  width: 84px; height: 84px; display: grid; place-items: center; pointer-events: none;
}
#hint .dot { width: 34px; height: 34px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 18px rgba(255,212,0,.9); animation: tapDot 1s ease-in-out infinite; }
#hint .ring { position: absolute; inset: 0; border-radius: 50%; border: 5px solid #fff; opacity: 0; animation: tapRing 1s ease-out infinite; }
#hint.urgent .dot { background: var(--pop); box-shadow: 0 0 22px rgba(255,79,163,1); animation-duration: .45s; }
#hint.urgent .ring { animation-duration: .45s; border-color: var(--sun); }
@keyframes tapDot { 0%,55%,100% { transform: scale(1) } 70% { transform: scale(.7) } }
@keyframes tapRing { 0%,60% { transform: scale(.4); opacity: 0 } 70% { opacity: 1 } 100% { transform: scale(1.1); opacity: 0 } }

/* タイトル */
#title {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 3vh, 26px);
  text-align: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at center, rgba(27,20,70,.15) 0%, rgba(18,12,51,.65) 75%); cursor: pointer;
}
.logo { display: flex; flex-direction: column; align-items: center; line-height: 1; transform: rotate(-4deg); }
.logo span {
  font-family: var(--f-display); font-size: clamp(30px, 7vw, 76px); color: #fff; letter-spacing: .04em;
  text-shadow: 0 4px 0 var(--pop), 0 8px 0 #8a1f57, 0 0 30px rgba(255,79,163,.6);
}
.logo b {
  font-family: var(--f-display); font-weight: 400; font-size: clamp(64px, 16vw, 180px); color: var(--sun); margin-top: -.06em;
  text-shadow: 0 5px 0 #ff8a00, 0 10px 0 #b04a00, 0 16px 24px rgba(0,0,0,.5), 0 0 50px rgba(255,212,0,.5);
  animation: boing 1.2s cubic-bezier(.3,1.6,.5,1) infinite;
}
@keyframes boing { 0%,100% { transform: translateY(0) scale(1,1) } 15% { transform: translateY(6px) scale(1.08,.9) } 40% { transform: translateY(-18px) scale(.95,1.06) } 65% { transform: translateY(0) scale(1.03,.97) } }
.lead { margin: 0; text-wrap: balance; word-break: keep-all; font-size: clamp(18px, 3vw, 28px); text-shadow: 0 2px 0 #120c33; }
.start {
  font-family: var(--f-display); font-size: clamp(28px, 6vw, 48px); color: #3a1a00; background: var(--sun);
  border: 0; border-radius: 999px; padding: .4em 1.6em; cursor: pointer;
  box-shadow: 0 8px 0 #c47a00, 0 12px 26px rgba(0,0,0,.45), 0 0 40px rgba(255,212,0,.5);
  animation: startPulse 1s ease-in-out infinite;
}
.start:focus-visible { outline: 4px solid #fff; outline-offset: 6px; }
@keyframes startPulse { 0%,100% { transform: translateY(0) scale(1) } 50% { transform: translateY(-4px) scale(1.06) } }

#combo {
  position: absolute; top: calc(96px + env(safe-area-inset-top, 0px)); right: calc(20px + env(safe-area-inset-right, 0px));
  font-family: var(--f-display); font-size: 24px; color: #fff; -webkit-text-stroke: 3px var(--pop); paint-order: stroke fill;
  transform-origin: right center; white-space: nowrap;
}
#combo b { font-weight: 400; color: var(--sun); font-size: 1.4em; }
#combo.bump { animation: bump .3s cubic-bezier(.3,1.8,.5,1); }
#fever { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; }
#fever span {
  font-family: var(--f-display); font-size: clamp(26px, 5vw, 50px); white-space: nowrap;
  background: linear-gradient(90deg, #ff4fa3, #ffd400, #7dffb2, #23c4ff, #b36bff, #ff4fa3); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 #120c33) drop-shadow(0 0 14px rgba(255,255,255,.6));
  animation: rainbow .6s linear infinite, wiggle .3s ease-in-out infinite alternate;
}
#fever i { display: block; width: min(40vw, 280px); height: 12px; border-radius: 6px; transform-origin: left center;
  background: linear-gradient(90deg, #ff4fa3, #ffd400, #7dffb2, #23c4ff); box-shadow: 0 0 14px rgba(255,255,255,.7); }
@keyframes wiggle { from { transform: rotate(-3deg) scale(1) } to { transform: rotate(3deg) scale(1.08) } }
#vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; animation: vig 1.2s linear infinite; }
body.fever #vignette { opacity: 1; }
@keyframes vig {
  0%, 100% { box-shadow: inset 0 0 70px 6px rgba(255,79,163,.4) } 25% { box-shadow: inset 0 0 70px 6px rgba(255,212,0,.4) }
  50% { box-shadow: inset 0 0 70px 6px rgba(125,255,178,.4) } 75% { box-shadow: inset 0 0 70px 6px rgba(35,196,255,.4) }
}
.fly { position: absolute; font-size: 34px; color: var(--sun); text-shadow: 0 0 12px rgba(255,212,0,.95), 0 2px 0 #7a4a00; pointer-events: none; transform: translate(-50%, -50%); }
#promise {
  position: fixed; inset: 0; display: grid; place-items: center; background: rgba(18,12,51,.72);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#promise .card {
  width: min(100%, 520px); background: var(--paper); color: var(--ink); border-radius: 32px; border: 6px solid var(--sun);
  padding: 24px 22px 30px; display: grid; justify-items: center; gap: 18px; text-align: center;
  box-shadow: 0 12px 0 #c47a00, 0 20px 40px rgba(0,0,0,.5);
  animation: cardIn .45s cubic-bezier(.3,1.6,.5,1);
}
#promise .pic { width: min(100%, 300px); height: auto; }
#promise p { margin: 0; font-family: var(--f-display); font-size: clamp(20px, 4.6vw, 30px); line-height: 1.5; word-break: keep-all; }
@keyframes cardIn { from { transform: scale(.4) rotate(-6deg); opacity: 0 } to { transform: scale(1) rotate(0); opacity: 1 } }
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s ease; }
#flash.on { opacity: 1; }
#flash.tint { transition: none; }

#loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 28px; background: var(--night); }

@media (prefers-reduced-motion: reduce) {
  .logo b, #floorPanel .arrow, #starPanel .star, #hint .dot, #hint .ring, .start { animation: none; }
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud" hidden>
  <div id="floorPanel">
    <span class="num" id="fromF">1<small>F</small></span>
    <span class="arrow">▲</span>
    <span class="num" id="toF">2<small>F</small></span>
    <div class="bar"><i id="barFill"></i></div>
  </div>
  <div id="starPanel"><span class="star">★</span><span id="starCount">0</span></div>
  <div id="combo" hidden><b id="comboN">0</b> れんぞく！</div>
  <div id="fever" hidden><span>フィーバー！！</span><i id="feverBar"></i></div>
</div>
<div id="pops"></div>
<div id="hint" hidden><span class="ring"></span><span class="dot"></span></div>
<div id="title">
  <div class="logo"><span>エスカレーター</span><b>ぴょん！</b></div>
  <p class="lead">ほしを あつめながら うえの かいへ いこう</p>
  <button id="startBtn" class="start" type="button">はじめる！</button>
</div>
<div id="vignette"></div>
<div id="promise" hidden>
  <div class="card">
    <svg class="pic" viewBox="0 0 220 130" aria-hidden="true">
      <path d="M10 118 H48 V100 H70 V82 H92 V64 H114 V46 H136 V28 H210" fill="none" stroke="#9aa0ad" stroke-width="7" stroke-linejoin="round"/>
      <path d="M10 118 H48 V100 H70 V82 H92 V64 H114 V46 H136 V28 H210 V128 H10 Z" fill="#e6e8f0"/>
      <path d="M48 104 H70 M70 86 H92 M92 68 H114 M114 50 H136" stroke="#ffd400" stroke-width="5"/>
      <path d="M14 78 C30 78 38 70 50 60 L150 -2" fill="none" stroke="#2a1f66" stroke-width="7" stroke-linecap="round"/>
      <circle cx="82" cy="60" r="18" fill="#ff7a3d"/>
      <circle cx="76" cy="56" r="4.5" fill="#fff"/><circle cx="90" cy="56" r="4.5" fill="#fff"/>
      <circle cx="77" cy="57" r="2.2" fill="#15102e"/><circle cx="91" cy="57" r="2.2" fill="#15102e"/>
      <path d="M78 66 Q83 70 88 66" fill="none" stroke="#15102e" stroke-width="2" stroke-linecap="round"/>
      <path d="M96 52 L104 34" stroke="#ff7a3d" stroke-width="6" stroke-linecap="round"/>
      <circle cx="186" cy="74" r="24" fill="none" stroke="#2fbf5f" stroke-width="8"/>
    </svg>
    <p>ほんものの エスカレーターでは<br>とんだり はねたり しないでね！</p>
    <button id="okBtn" class="start" type="button">おっけー！</button>
  </div>
</div>
<div id="flash"></div>
<div id="loading">じゅんびちゅう…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = (id) => document.getElementById(id);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);

// ================= レンダラー =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
const MOBILE = matchMedia('(pointer: coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
$('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1446);
scene.fog = new THREE.Fog(0x1b1446, 30, 80);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 220);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.4, 1.1);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x4a3a80, 0.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.15);
sun.castShadow = true;
sun.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 0.5, far: 45 });
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);

// ================= テクスチャ =================
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const grooveTex = canvasTex(128, 128, (x, w, h) => {
  x.fillStyle = '#d3d7e0'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#6a7080'; for (let i = 0; i < w; i += 8) x.fillRect(i, 0, 3, h);
});
grooveTex.wrapS = grooveTex.wrapT = THREE.RepeatWrapping; grooveTex.repeat.set(5, 1);
const plateTex = grooveTex.clone(); plateTex.repeat.set(5, 4); plateTex.needsUpdate = true;
function railTexture() {
  const t = canvasTex(64, 16, (x, w, h) => {
    x.fillStyle = '#1b1b22'; x.fillRect(0, 0, w, h);
    x.fillStyle = '#4a4a58'; x.fillRect(0, 0, 10, h);
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(90, 1);
  return t;
}
function tileTexture(rx, ry) {
  const t = canvasTex(256, 256, (x, w, h) => {
    x.fillStyle = '#6f64a8'; x.fillRect(0, 0, w, h);
    x.fillStyle = '#8278bb'; x.fillRect(0, 0, 128, 128); x.fillRect(128, 128, 128, 128);
    x.fillStyle = '#4e4489'; x.fillRect(0, 0, w, 3); x.fillRect(0, 0, 3, h); x.fillRect(0, 127, w, 3); x.fillRect(127, 0, 3, h);
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  return t;
}
const dotTex = canvasTex(64, 64, (x, w) => {
  const g = x.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,.8)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, w, w);
});
function signTexture(text, bg, fg, w = 512, h = 160, size = 96) {
  return canvasTex(w, h, (x) => {
    x.fillStyle = bg; x.beginPath(); x.roundRect(6, 6, w - 12, h - 12, 36); x.fill();
    x.lineWidth = 10; x.strokeStyle = fg; x.stroke();
    x.fillStyle = fg; x.font = `${size}px "Mochiy Pop One", sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(text, w / 2, h / 2 + 6);
  });
}

// ================= エスカレーターの形 =================
// 下の踊り場(F1) → 30°の斜面(LINC) → 上の踊り場(F2) の一本道。s は道にそった距離。
const TH = Math.PI / 6, SIN = Math.sin(TH), COS = Math.cos(TH);
const F1 = 3, LINC = 22, F2 = 4, TOTAL = F1 + LINC + F2;
const H = LINC * SIN, ZI = F1 + LINC * COS, ZTOP = ZI + F2;
const NSTEP = 72, PITCH = TOTAL / NSTEP;
const W = 1.7;
const S0 = -1.6, S1 = TOTAL + 1.6;
function pathPos(s, out = new THREE.Vector3()) {
  if (s < F1) return out.set(0, 0, s);
  if (s < F1 + LINC) { const d = s - F1; return out.set(0, d * SIN, F1 + d * COS); }
  return out.set(0, H, ZI + (s - F1 - LINC));
}
const wrap = (v, m) => ((v % m) + m) % m;

const treadGeo = new THREE.BoxGeometry(W, 0.6, PITCH * 0.985).translate(0, -0.3, -PITCH / 2);
const edgeGeo = mergeGeometries([
  new THREE.BoxGeometry(W, 0.014, 0.07).translate(0, 0.007, -PITCH + 0.045),
  new THREE.BoxGeometry(0.05, 0.014, PITCH * 0.97).translate(W / 2 - 0.03, 0.007, -PITCH / 2),

function band(s0, s1, bot, top) {
  const pts = [s0, F1, F1 + LINC, s1].map((s) => pathPos(s));
  const sh = new THREE.Shape();
  sh.moveTo(pts[0].z, pts[0].y + bot);
  for (let k = 1; k < pts.length; k++) sh.lineTo(pts[k].z, pts[k].y + bot);
  for (let k = pts.length - 1; k >= 0; k--) sh.lineTo(pts[k].z, pts[k].y + top);
  return sh;
}
function sidePanels(shape, thick, mat, xInner, group, shadow = true) {
  const geo = new THREE.ExtrudeGeometry(shape, { depth: thick, bevelEnabled: false });
  geo.rotateY(-Math.PI / 2); // 形の横軸→z、押し出し→-x
  for (const side of [1, -1]) {
    const m = new THREE.Mesh(geo, mat);
    m.position.x = side > 0 ? xInner + thick : -xInner;
    m.receiveShadow = shadow;
    group.add(m);
  }
}
function pathCurve(s0, s1, dy, x, step = 0.3) {
  const pts = [];
  for (let s = s0; s <= s1 + 1e-6; s += step) { const p = pathPos(s); pts.push(new THREE.Vector3(x, p.y + dy, p.z)); }
  return new THREE.CatmullRomCurve3(pts, false, 'centripetal');
}
function railCurve(x) {
  const r = 0.42, y0 = 1.04, a = S0 + 0.15, b = S1 - 0.15;
  const pts = [];
  const pa = pathPos(a), pb = pathPos(b);
  for (let i = 0; i <= 10; i++) { const t = -Math.PI / 2 + Math.PI * i / 10; pts.push(new THREE.Vector3(x, pa.y + y0 - r + r * Math.sin(t), pa.z - r * Math.cos(t))); }
  for (let s = a + 0.3; s < b - 0.15; s += 0.3) { const p = pathPos(s); pts.push(new THREE.Vector3(x, p.y + y0, p.z)); }
  for (let i = 0; i <= 10; i++) { const t = Math.PI / 2 - Math.PI * i / 10; pts.push(new THREE.Vector3(x, pb.y + y0 - r + r * Math.sin(t), pb.z + r * Math.cos(t))); }
  return new THREE.CatmullRomCurve3(pts, false, 'centripetal');
}

// 虹色に流れる LED チューブ
const ledTubes = [];
function rainbowTube(curve, radius, segs, len, dir, parent) {
  const geo = new THREE.TubeGeometry(curve, segs, radius, 6, false);
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count * 3), 3));
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false }));
  mesh.userData = { segs, len, dir };
  parent.add(mesh);
  ledTubes.push(mesh);
  return mesh;
}
const tmpC = new THREE.Color();
function updateTubes(t, boost) {
  for (const m of ledTubes) {
    const { segs, len, dir } = m.userData;
    const col = m.geometry.attributes.color;
    const k = 1.05 + Math.min(boost, 1) * 0.6;
    for (let i = 0; i <= segs; i++) {
      const u = i / segs;
      tmpC.setHSL(wrap(u * len / 7 - t * 0.45 * dir, 1), 1, 0.55);
      const r = tmpC.r * k, g = tmpC.g * k, b = tmpC.b * k;
      for (let j = 0; j <= 6; j++) { const idx = i * 7 + j; col.array[idx * 3] = r; col.array[idx * 3 + 1] = g; col.array[idx * 3 + 2] = b; }
    }
    col.needsUpdate = true;
  }
}

const dummy = new THREE.Object3D();
function createEscalator(x0, dir) {
  const g = new THREE.Group(); g.position.x = x0; scene.add(g);
  const treads = new THREE.InstancedMesh(treadGeo, treadMat, NSTEP);
  const edges = new THREE.InstancedMesh(edgeGeo, edgeMat, NSTEP);
  treads.receiveShadow = true;
  g.add(treads, edges);

  sidePanels(band(S0, S1, -1.1, 0.35), 0.22, cladMat, W / 2 + 0.04, g);
  sidePanels(band(S0 + 0.1, S1 - 0.1, -0.7, 0.35), 0.03, steelMat, W / 2 + 0.01, g);
  sidePanels(band(S0 + 0.15, S1 - 0.15, 0.35, 0.98), 0.02, glassMat, W / 2 + 0.1, g, false);

  const railTex = railTexture();
  const railMat = new THREE.MeshStandardMaterial({ map: railTex, roughness: 0.45, metalness: 0.1 });
  for (const side of [1, -1]) {
    const rail = new THREE.Mesh(new THREE.TubeGeometry(railCurve(side * (W / 2 + 0.11)), 500, 0.065, 10, false), railMat);
    rail.castShadow = true; g.add(rail);
    rainbowTube(pathCurve(S0 + 0.3, S1 - 0.3, 0.94, side * (W / 2 + 0.11)), 0.022, 360, S1 - S0, dir, g);
    rainbowTube(pathCurve(S0 + 0.3, S1 - 0.3, 0.24, side * (W / 2 + 0.012)), 0.018, 360, S1 - S0, dir, g);
  }

  // 外がわの ちかちか電球
  const bulbS = [];
  for (let s = S0 + 0.1; s < S1 - 0.1; s += 0.32) bulbS.push(s);
  const bulbs = new THREE.InstancedMesh(new THREE.SphereGeometry(0.05, 10, 8), new THREE.MeshBasicMaterial({ toneMapped: false }), bulbS.length * 2);
  bulbS.forEach((s, i) => {
    const p = pathPos(s);
    for (const [k, side] of [[0, 1], [1, -1]]) {
      dummy.position.set(side * (W / 2 + 0.22), p.y + 0.37, p.z); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(1); dummy.updateMatrix();
      bulbs.setMatrixAt(i * 2 + k, dummy.matrix);
      bulbs.setColorAt(i * 2 + k, tmpC.set(0xffffff));
    }
  });
  g.add(bulbs);

  // くし板と のりおり口のプレート
  for (const [z, y, flip] of [[-1.15, 0, 1], [ZTOP + 1.15, H, -1]]) {
    const plate = new THREE.Mesh(new THREE.BoxGeometry(W + 0.02, 0.07, 3), plateMat);
    plate.position.set(0, y - 0.005, z); plate.receiveShadow = true; g.add(plate);
    const comb = new THREE.Mesh(new THREE.BoxGeometry(W + 0.02, 0.05, 0.12), combMat);
    comb.position.set(0, y + 0.03, z + flip * 1.47); g.add(comb);
  }

  return {
    g, treads, edges, bulbs, bulbS, railTex, dir, offset: 0,
    update(dt, t, v, boost) {
      this.offset = wrap(this.offset + v * dt * this.dir, TOTAL);
      for (let i = 0; i < NSTEP; i++) {
        const s = wrap(i * PITCH + this.offset, TOTAL);
        const p = pathPos(s);
        dummy.position.set(0, p.y, p.z); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(1); dummy.updateMatrix();
        treads.setMatrixAt(i, dummy.matrix); edges.setMatrixAt(i, dummy.matrix);
      }
      treads.instanceMatrix.needsUpdate = true; edges.instanceMatrix.needsUpdate = true;
      this.railTex.offset.x -= (v / (S1 - S0 + 2)) * this.railTex.repeat.x * dt * this.dir;
      const n = this.bulbS.length;
      for (let i = 0; i < n; i++) {
        const s = this.bulbS[i];
        const on = Math.sin(s * 3.2 - t * 9 * this.dir) > 0.3;
        tmpC.setHSL(wrap(s * 0.04 - t * 0.2, 1), 1, 0.6).multiplyScalar(on ? 1.15 + Math.min(boost, 1) * 0.6 : 0.25);
        bulbs.setColorAt(i * 2, tmpC); bulbs.setColorAt(i * 2 + 1, tmpC);
      }
      bulbs.instanceColor.needsUpdate = true;
    },
  };
}

// ================= まいフレーム =================
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), wantPos = new THREE.Vector3(), wantLook = new THREE.Vector3();
let snapCamera = true;
const tmpV = new THREE.Vector3();

function update(dt) {
  G.t += dt;
  const t = G.t;
  for (let i = G.events.length - 1; i >= 0; i--) if (G.events[i].at <= t) { const e = G.events.splice(i, 1)[0]; e.fn(); }

  G.boost *= Math.exp(-2.2 * dt);
  G.beat *= Math.exp(-7 * dt);
  const fever = G.fever > 0;
  const glow = G.boost + G.beat * 0.5 + (fever ? 0.15 : 0);
  escUp.update(dt, t, G.v, glow);
  escDown.update(dt, t, G.v, glow * 0.6);
  G.ledT += dt * (fever ? 4 : 1);
  updateTubes(G.ledT, G.boost * 0.7 + G.beat * 0.2 + (fever ? 0.15 : 0));
  for (const m of spots) {
    const sp = fever ? 2.4 : 0.6, ph = m.userData.ph;
    m.rotation.z = Math.sin(t * sp + ph) * 0.3; m.rotation.x = Math.cos(t * sp * 0.8 + ph) * 0.45;
    m.material.opacity = 0.025 + G.beat * 0.02 + (fever ? 0.02 : 0);
    m.material.color.setHSL(wrap(ph * 0.2 + t * (fever ? 0.6 : 0.05), 1), 1, 0.5);
  }
  if (fever) {
    G.fever -= dt;
    ui.feverBar.style.transform = `scaleX(${Math.max(0, G.fever / G.feverMax)})`;
    scene.background.setHSL(wrap(t * 0.25, 1), 0.45, 0.1); scene.fog.color.copy(scene.background);
    if (G.state === 'ride') burst(tmpV.set(0, player.position.y + 0.45, player.position.z - 0.3), 1, { speed: 0.6, up: 0.3, grav: -0.3, hue: wrap(t * 1.5, 1), life: [0.3, 0.6], k: 1.17 });
    if (G.fever <= 0) endFever();
  }
  if (G.state === 'ride' && G.beat > 0.97 && G.jumpY === 0 && G.roll <= 0) G.squash = Math.min(G.squash, -0.12);

  // キャラクターの位置
  let groundY = 0, groundZ = -0.9;
  if (G.state === 'title') {
    groundY = 0; groundZ = -0.9;
    G.jumpY = Math.max(0, Math.sin(t * 5)) * 0.35;
    if (G.jumpY === 0 && G.squash > -0.1) G.squash = -0.2;
  } else if (G.state === 'ride') {
    const sa = wrap(G.ip * PITCH + escUp.offset, TOTAL);
    G.back *= Math.exp(-4.5 * dt);
    const p = pathPos(sa + G.back, tmpV);
    groundY = p.y; groundZ = p.z - PITCH / 2;
    G.sP = sa - PITCH / 2;
    G.boardOff *= Math.exp(-7 * dt);
    groundZ += G.boardOff;
    if (sa > TOTAL - 1.0) arrive();
  } else if (G.state === 'arrive') {
    G.arriveT += dt;
    G.walkZ += (ZTOP + 1.3 - G.walkZ) * (1 - Math.exp(-3 * dt));
    groundY = H; groundZ = G.walkZ;
    if (G.jumpY === 0 && G.arriveT > 0.4) { G.vy = 5.5; G.jumpY = 0.001; G.squash = 0.2; SFX.jump(); }
  }

  if (G.state !== 'title') {
    if (G.jumpY > 0 || G.vy > 0) {
      G.vy -= 20 * dt; G.jumpY += G.vy * dt;
      if (G.jumpY <= 0) {
        G.jumpY = 0; G.vy = 0; G.jumps = 0; G.squash = -0.35;
        burst(tmpV.set(0, groundY + 0.05, groundZ), 10, { speed: 1.4, up: 0.4, hue: 0.6, sat: 0.3, light: 0.85, grav: 3, life: [0.25, 0.5], k: 1.04 });
      }
    }
  }
  player.position.set(0, groundY + G.jumpY, groundZ);

  // ぷにぷにアニメ
  G.squash += (0 - G.squash) * (1 - Math.exp(-10 * dt));
  const stretch = G.jumpY > 0 ? THREE.MathUtils.clamp(G.vy * 0.03, -0.15, 0.2) : 0;
  const sy = 1 + G.squash + stretch, sxz = 1 - (G.squash + stretch) * 0.5;
  body.scale.set(sxz, sy, sxz);
  if (G.roll > 0) { G.roll = Math.max(0, G.roll - dt); body.rotation.x = -(1 - G.roll / 0.9) * Math.PI * 4; }
  else if (G.flip > 0) { G.flip = Math.max(0, G.flip - dt * 2.4); body.rotation.x = (1 - G.flip) * Math.PI * 2; } else body.rotation.x = 0;
  if (G.dizzy > 0) { G.dizzy -= dt; body.rotation.y = 0.75 + (0.8 - Math.max(G.dizzy, 0)) * Math.PI * 2.5; } else body.rotation.y = 0.75 + Math.sin(t * 2) * 0.12;
  antenna.rotation.z = Math.sin(t * 9) * 0.15 + G.vy * 0.02;
  bulbMat.color.setHSL(wrap(t * 0.5, 1), 1, 0.6).multiplyScalar(1.6 + G.boost * 0.8);

  // ほし
  for (const st of stars) {
    if (st.got) {
      st.mesh.scale.multiplyScalar(Math.exp(-6 * dt)); st.mesh.position.y += dt * 3; st.mesh.rotation.y += dt * 20;
      if (st.mesh.scale.x < 0.05 && st.mesh.parent) scene.remove(st.mesh);
      continue;
    }
    st.mesh.rotation.y = t * 2.5 + st.ph;
    st.drop *= Math.exp(-5 * dt);
    st.mesh.position.y = pathPos(st.s, tmpV).y + 0.6 + st.j + st.drop + Math.sin(t * 3 + st.ph) * 0.05;
    if (st.rainbow) st.mesh.material.emissive.setHSL(wrap(t * 0.8, 1), 1, 0.5);
    if (G.state === 'ride' && st.drop < 0.3 && Math.abs(st.s - G.sP) < 0.42 && Math.abs(st.j - G.jumpY) < 0.62) collectStar(st);
  }

  // 落ちてくるもの
  if (G.state === 'ride') {
    G.spawnT -= dt;
    if (G.spawnT <= 0 && G.sP < TOTAL - 7) { spawnBall(); G.spawnT = rand(1.8, 3.0) * Math.max(0.65, 1 - 0.06 * (G.floor - 1)); }
    G.goodT -= dt;
    if (G.goodT <= 0 && G.sP < TOTAL - 6) { spawnGoodie(); G.goodT = rand(3.5, 5.5); }
  }
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i], r = b.def.r, mv = b.def.move;
    b.age += dt;
    if (b.fly) {
      // 手すりをこえて 下の床へ ひゅーん → ぽよん
      b.flyT += dt;
      b.fly.y -= 14 * dt;
      b.mesh.position.addScaledVector(b.fly, dt);
      b.mesh.rotation.x += dt * b.spin; b.mesh.rotation.z += dt * b.spin * 0.5;
      const floorY = (b.mesh.position.z > ZI + 0.1 ? H : 0) + r;
      if (b.mesh.position.y < floorY && b.fly.y < 0 && Math.abs(b.mesh.position.x) > 1.4) {
        b.mesh.position.y = floorY; b.fly.y *= -0.55; b.fly.x *= 0.6; b.fly.z *= 0.6; b.spin *= 0.6; b.bounces++;
        if (b.bounces === 1) { SFX.thud(); burst(b.mesh.position, 18, { speed: 2.5, up: 1, light: 0.8, sat: 0.5, k: 1.3 }); }
        else if (b.bounces < 4) SFX.land();
      }
      if (b.flyT > 3) b.mesh.scale.multiplyScalar(Math.exp(-5 * dt));
      if (b.flyT > 4 || b.mesh.position.y < -8) { scene.remove(b.mesh); balls.splice(i, 1); }
      continue;
    }
    b.s -= b.speed * dt;
    const p = pathPos(b.s, tmpV);
    const onSlope = b.s > F1 && b.s < F1 + LINC;
    let lift = 0;
    if (mv === 'roll') { lift = onSlope ? Math.abs(Math.sin(b.s / PITCH * Math.PI)) * 0.12 : 0; b.mesh.rotation.x -= b.speed * dt / r; }
    else if (mv === 'hop') { lift = Math.abs(Math.sin(b.age * 4)) * 0.8; b.mesh.rotation.x -= b.speed * dt / r; }
    else if (mv === 'tumble') {
      const ph = b.s / PITCH, fl = Math.floor(ph), fr = ph - fl;
      lift = Math.sin(fr * Math.PI) * 0.22;
      b.mesh.rotation.x = (fl + fr * fr * (3 - 2 * fr)) * Math.PI / 2;
      if (fl !== b.step) { b.step = fl; if (Math.abs(b.s - G.sP) < 8) SFX.clunk(); }
    } else {
      lift = Math.abs(Math.sin(b.age * 10)) * 0.05;
      b.mesh.rotation.z = Math.sin(b.age * 8) * 0.25;
      if (Math.random() < dt * 0.35 && Math.abs(b.s - G.sP) < 10) SFX.quack();
    }
    b.mesh.position.set(0, p.y + 0.2 + r + lift, p.z);
    b.mesh.scale.setScalar(Math.min(1, b.age * 3));
    const ds = b.s - G.sP;
    if (G.state === 'ride' && !b.hit && !b.passed) {
      const top = lift + 2 * r - 0.12;
      if (Math.abs(ds) < r + 0.2 && G.jumpY < top && G.roll <= 0) hitByBall(b);
      else if (ds < -(r + 0.25)) {
        b.passed = true;
        G.combo++; SFX.dodge(); G.boost = Math.min(G.boost + 0.6, 1.6);
        const w = ['よけた！', 'ナイス！', 'かわした！', 'ぴょーん！'][Math.floor(Math.random() * 4)];
        popAt(`${w} +${G.fever > 0 ? 2 : 1}`, player.position.clone().add(new THREE.Vector3(0, 1.5, 0)));
        burst(player.position.clone().add(new THREE.Vector3(0, 0.4, 0)), 40, { speed: 3, up: 1, k: 1.69 });
        gain(1, player.position.clone().add(new THREE.Vector3(0, 0.5, 0)));
      }
    }
    if (b.s < 0.3 || ds < -9) { scene.remove(b.mesh); balls.splice(i, 1); }
  }
  // 空から おかし
  for (let i = goodies.length - 1; i >= 0; i--) {
    const g = goodies[i];
    g.mesh.rotation.y += dt * 3;
    if (g.got) {
      g.mesh.scale.multiplyScalar(Math.exp(-7 * dt)); g.mesh.position.y += dt * 3;
      if (g.mesh.scale.x < 0.05) { scene.remove(g.mesh); goodies.splice(i, 1); }
      continue;
    }
    if (!g.landed) {
      g.vy -= 16 * dt; g.mesh.position.y += g.vy * dt; g.mesh.rotation.z += dt * 6;
      if (g.mesh.position.y <= g.restY) {
        g.mesh.position.y = g.restY; g.vy = -g.vy * 0.45; g.bounces++;
        if (g.bounces === 1) { SFX.land(); burst(g.mesh.position, 16, { speed: 2, up: 1, hue: 0.9, k: 1.3 }); }
        if (g.bounces >= 3) { g.landed = true; scene.remove(g.ring); g.mesh.rotation.z = 0; }
      }
      g.ring.scale.setScalar(1 + 0.18 * Math.sin(t * 14));
    } else g.mesh.position.y = g.restY + Math.sin(t * 4 + i) * 0.06;
    const ds = g.s - G.sP, dy = g.mesh.position.y - (player.position.y + 0.45);
    if (G.state === 'ride' && Math.abs(ds) < 0.5 && Math.abs(dy) < 0.8) collectGoodie(g);
    else if (ds < -6) { scene.remove(g.mesh); scene.remove(g.ring); goodies.splice(i, 1); }
  }

  // ヒント
  if (G.state === 'ride') {
    G.hintT += dt;
    const near = balls.some((b) => !b.fly && !b.hit && !b.passed && b.s - G.sP > 0.4 && b.s - G.sP < 3.2);
    ui.hint.classList.toggle('urgent', near && G.floor <= 2);
    ui.hint.hidden = !(G.hintT < 5 || (near && G.floor <= 2));
    ui.bar.style.width = Math.min(100, Math.max(0, (G.sP - 1) / (TOTAL - 2.2) * 100)) + '%';
  }
  if (G.state === 'arrive') ui.bar.style.width = '100%';

  // かざり
  for (const b of balloons) { b.position.y = b.userData.y0 + Math.sin(t * 0.8 + b.userData.ph) * 0.4; b.rotation.z = Math.sin(t * 0.6 + b.userData.ph) * 0.12; }
  flagLines.forEach((f, i) => (f.rotation.x = Math.sin(t * 1.3 + i) * 0.05));

  updateParticles(dt);
  updateConfetti(dt);

  // カメラ
  const pp = player.position;
  if (G.state === 'title') {
    const a = t * 0.12 + 0.6, c = new THREE.Vector3(-1, H * 0.45, ZI * 0.5);
    wantPos.set(c.x + Math.cos(a) * 21, c.y + 5 + Math.sin(t * 0.3) * 1.5, c.z + Math.sin(a) * 15 - 4);
    wantLook.copy(c);
  } else if (G.state === 'arrive') {
    wantPos.set(pp.x + 5.5, pp.y + 2.4, pp.z - 6.5);
    wantLook.set(pp.x - 0.5, pp.y + 2.6, pp.z + 4);
  } else {
    wantPos.set(pp.x + 4.4, pp.y - G.jumpY * 0.6 + 4.0, pp.z - 3.6);
    wantLook.set(pp.x - 0.3, pp.y - G.jumpY * 0.5 + 0.9, pp.z + 2.6);
  }
  if (snapCamera) { camPos.copy(wantPos); camLook.copy(wantLook); snapCamera = false; }
  const k = 1 - Math.exp(-(G.state === 'title' ? 1.5 : 4) * dt);
  camPos.lerp(wantPos, k); camLook.lerp(wantLook, k);
  camera.position.copy(camPos);
  if (G.shake > 0 && !REDUCED) { G.shake -= dt; camera.position.x += rand(-1, 1) * G.shake * 0.4; camera.position.y += rand(-1, 1) * G.shake * 0.4; }
  camera.lookAt(camLook);
  G.fovKick *= Math.exp(-6 * dt);
  const fov = 55 + G.fovKick + (fever ? 5 : 0) + (innerWidth < innerHeight ? 12 : 0);
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
  bloom.strength = Math.min(0.7, 0.45 + G.boost * 0.15 + G.beat * 0.05 + (fever ? 0.05 : 0));

  const focus = G.state === 'title' ? new THREE.Vector3(0, H * 0.5, ZI * 0.5) : pp;
  sun.position.set(focus.x + 6, focus.y + 12, focus.z - 4);
  sun.target.position.copy(focus);
}

let last = performance.now();
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
  update(dt);
  composer.render();
  requestAnimationFrame(frame);
}

function boot(data) {
  G.floor = data?.floor || 1;
  G.score = data?.score || 0;
  ui.stars.textContent = G.score;
  applyTheme(); layoutStars();
  $('loading').remove();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ floor: G.floor, score: G.score }));
document.fonts.load('40px "Mochiy Pop One"').catch(() => {}).finally(() => {
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
});
</script>
</body>
